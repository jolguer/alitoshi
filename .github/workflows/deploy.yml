name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: 198.89.96.27
          port: 56364
          username: bursatilec_webuser
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './*'
          remote_path: '/'
          sftp_only: true
          delete_remote_files: false

      - name: Fallback — Deploy via FTP
        if: failure()
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 198.89.96.27
          port: 56364
          username: bursatilec_webuser
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/docs/**
            **/.github/**
            **/README.md
